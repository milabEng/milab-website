<section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-lg-offset-2 text-center">
                <h2 class="section-heading">Kontakt</h2>
                <hr class="primary">
                <p>Bereit, Ihr nächstes Projekt mit mir anzugehen? Das freut mich!
                    Schreiben Sie mir eine E-Mail – ich melde mich schnellstmöglich bei Ihnen!</p>
            </div>
            <div class="col-lg-2 col-lg-offset-4 text-center">
                <a href="mailto:{{ site.email }}">
                    <i class="fa fa-envelope-o fa-3x wow bounceIn" data-wow-delay=".1s"></i>
                    <p>{{ site.email }}</p>
                </a>
            </div>
            <div class="col-lg-2 text-center">
                <p>
                    <i class="fa fa-map-marker fa-3x wow bounceIn" data-wow-delay=".2s"></i><br>
                    {{ site.address }}<br>
                    {{ site.zip_city }}
                </p>
            </div>
        </div>
    </div>
</section>
